alias: Schlafzimmer Schalter (E1743) Licht
description: Ein/Aus kurz schaltet die Gruppe, Ein/Aus gehalten dimmt in 2-%-Schritten, bis losgelassen wird
mode: restart
triggers:
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_short_press
    subtype: turn_on
    id: an
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_short_press
    subtype: turn_off
    id: aus
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_long_press
    subtype: dim_up
    id: heller
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_long_press
    subtype: dim_down
    id: dunkler
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_long_release
    subtype: dim_up
    id: stopp
  - trigger: device
    domain: zha
    device_id: c4d43ed7c7218e167b55741ae374bf26
    type: remote_button_long_release
    subtype: dim_down
    id: stopp
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: an
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.schlafzimmer_schlafzimmer
      - conditions:
          - condition: trigger
            id: aus
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.schlafzimmer_schlafzimmer
      - conditions:
          - condition: trigger
            id: heller
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ state_attr('light.schlafzimmer_schlafzimmer', 'brightness') | int(0) < 250 }}"
                - condition: template
                  value_template: "{{ repeat.index < 100 }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.schlafzimmer_schlafzimmer
                  data:
                    brightness_step_pct: 2
                    transition: 0.1
                - delay:
                    milliseconds: 150
      - conditions:
          - condition: trigger
            id: dunkler
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ state_attr('light.schlafzimmer_schlafzimmer', 'brightness') | int(0) > 5 }}"
                - condition: template
                  value_template: "{{ repeat.index < 100 }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: light.schlafzimmer_schlafzimmer
                  data:
                    brightness_step_pct: -2
                    transition: 0.1
                - delay:
                    milliseconds: 150
      - conditions:
          - condition: trigger
            id: stopp
        sequence: []
